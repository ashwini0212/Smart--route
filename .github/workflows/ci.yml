name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch/PR when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # `verify` compiles, runs all tests and packages the jar. Any failing test fails the job.
      - run: ./mvnw -B verify

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  scripts:
    name: Data scripts (Python unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/osm -v

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    # Only build images after the code they contain has passed its tests.
    needs: [backend, frontend, scripts]
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file
        run: cp .env.example .env && docker compose config --quiet
      - name: Validate the production overlay
        run: SITE_ADDRESS=:80 PUBLIC_URL=http://localhost docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml config --quiet
      - name: Build images
        run: docker compose build
