name: Deploy

# Redeploys the server after CI passes on main, or on demand from the Actions tab.
# Does nothing until the DEPLOY_HOST secret exists, so forks and a repo without a server stay green.
# Secrets (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST     public IP or host name of the server
#   DEPLOY_USER     the SSH user that ran deploy/setup-server.sh
#   DEPLOY_SSH_KEY  a private key whose public half is in that user's ~/.ssh/authorized_keys
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      # The exact commit CI tested; a manual run deploys the head of main.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Skip when no server is configured
        if: env.DEPLOY_HOST == ''
        run: echo "::notice::DEPLOY_HOST is not set, nothing to deploy. See docs/deployment.md."

      - name: Deploy over SSH
        if: env.DEPLOY_HOST != ''
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd ~/smartroute && git fetch --quiet origin main && git checkout --quiet --detach $DEPLOY_SHA && bash deploy/deploy.sh"
