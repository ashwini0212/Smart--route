spring:
  application:
    name: smartroute
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartroute}
    username: ${DB_USERNAME:smartroute}
    # No default: the password must come from the environment (.env locally, a secret store in production).
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    # The schema is owned by Flyway. Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Don't keep a DB session open during view rendering; it hides lazy-loading bugs and holds connections.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail fast: a slow or missing cache must not slow every route request down.
      timeout: 250ms
      connect-timeout: 250ms
  task:
    scheduling:
      # One thread is the default, and everything scheduled shares it: the outbox relay, the tracking sweep,
      # the heartbeat and the simulators. Measured with one thread, a 2 s sweep stalled the relay and pushed
      # the live map's p95 delay to 5.5 s (worst case 29 s). See docs/benchmarks/phase-10-live-tracking.txt.
      pool:
        size: ${SCHEDULING_THREADS:4}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      # acks=all + an idempotent producer: a send is acknowledged only once every in-sync replica has it,
      # and a retried send cannot produce a duplicate record on the broker.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 20000
        request.timeout.ms: 5000
    consumer:
      # The outbox is the source of truth, so a new consumer group reads the log from its start.
      auto-offset-reset: earliest
      # Offsets are committed by the container after the listener returns, never by a timer: a record that
      # failed every retry is only acknowledged once it has been written to the dead-letter topic.
      enable-auto-commit: false
      properties:
        spring.json.use.type.headers: false
    listener:
      ack-mode: record
      missing-topics-fatal: false

smartroute:
  security:
    jwt:
      # No usable default: the app refuses to start without a secret of at least 32 bytes.
      secret: ${JWT_SECRET:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:true}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    bootstrap-admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
  routing:
    # Folder with nodes.csv/edges.csv (scripts/osm). Empty: generate the synthetic city.
    dataset-directory: ${ROAD_NETWORK_DIR:}
    max-snap-distance-meters: 300
    cache-ttl: 10m
  tracking:
    # false stops the scheduled delay/route sweep (it can still be run with POST /api/tracking/sweep).
    enabled: ${TRACKING_ENABLED:true}
    sweep-interval: ${TRACKING_SWEEP_INTERVAL:15s}
    # How late a delivery must be predicted to arrive before an alert is raised, and how much worse an
    # already-reported delay must get before it is reported again.
    late-threshold: ${TRACKING_LATE_THRESHOLD:60s}
    late-growth: ${TRACKING_LATE_GROWTH:5m}
    # Relative change in a driver's route duration that counts as a recalculation (0.1 = 10 %).
    recalculate-shift: 0.1
    heartbeat: 20s
    position-ttl: 1h
  simulation:
    # [SIMULATION] Both invent data and are off unless asked for; see docs/phases/phase-10-live-tracking.md.
    drivers: ${SIMULATE_DRIVERS:false}
    traffic: ${SIMULATE_TRAFFIC:false}
    tick: ${SIMULATE_TICK:2s}
    speed-kph: ${SIMULATE_SPEED_KPH:30}
    traffic-tick: ${SIMULATE_TRAFFIC_TICK:30s}
    traffic-segments: ${SIMULATE_TRAFFIC_SEGMENTS:40}
    max-multiplier: ${SIMULATE_MAX_MULTIPLIER:4.0}
    seed: 42
  events:
    # false stops publishing to and consuming from Kafka (used by tests that need no broker); events are
    # still written to the outbox, because that happens inside the transaction that changed the data.
    enabled: ${EVENTS_ENABLED:true}
    relay-interval: ${EVENTS_RELAY_INTERVAL:500ms}
    keep-published: ${EVENTS_KEEP_PUBLISHED:7d}
  assistant:
    # The one optional feature (FR-24). Off unless both the flag is on and a key is present: a flag without a
    # key is not a configured assistant, and the API says so rather than failing on the first question.
    enabled: ${ASSISTANT_ENABLED:false}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ASSISTANT_MODEL:claude-opus-5-5}
    max-tokens: ${ASSISTANT_MAX_TOKENS:4000}
    # Each round is a paid request. Six is enough for "look up the warehouse, then its waiting orders, then
    # rank drivers for the oldest one" with room to recover from a wrong argument.
    max-tool-rounds: ${ASSISTANT_MAX_TOOL_ROUNDS:6}
    effort: ${ASSISTANT_EFFORT:medium}
  metrics:
    # The domain gauges (orders waiting, deliveries active, drivers available, outbox depth) are
    # recomputed on this timer rather than inside a Prometheus scrape, so the database cost does not
    # depend on how many collectors are scraping. A gauge can be up to this stale.
    sample-interval: ${METRICS_SAMPLE_INTERVAL:30s}
  seed:
    # Password for the demo logins created by the "seed" profile; demo users are skipped when empty.
    demo-password: ${DEMO_USER_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  # Take the client IP and scheme from X-Forwarded-* headers, but only when the direct peer is on a
  # private network (the reverse proxy). Needed so the login rate limit sees real client IPs, not nginx's.
  forward-headers-strategy: native
  # Never leak stack traces or exception messages to API clients.
  error:
    include-stacktrace: never
    include-message: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # health and info are public; metrics and prometheus require an ADMIN token (see SecurityConfig).
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # /actuator/health/liveness and /actuator/health/readiness for Docker/Kubernetes probes.
      probes:
        enabled: true
      group:
        # Redis is only a cache, so its outage must not take the app out of the load balancer.
        readiness:
          include: readinessState,db
      show-details: never
  info:
    env:
      enabled: true
  metrics:
    tags:
      # Every metric carries these, so one scraper can hold several deployments apart.
      application: smartroute
      environment: ${DEPLOY_ENV:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        # Buckets chosen around what this API actually does: a cached route is single-digit ms, an optimize
        # call is hundreds. Without these the histogram has no bucket where our latencies actually fall.
        http.server.requests: 10ms,50ms,100ms,500ms,1s,5s
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

info:
  app:
    name: SmartRoute
    description: Intelligent real-time logistics and route optimization platform
    version: '@project.version@'

logging:
  pattern:
    # Every log line carries the request's correlation id (see CorrelationIdFilter) and, once a request is
    # authenticated, the user id (see RequestLogFilter). Never the email: a log should not hold personal data.
    level: "%5p [%X{traceId:-}] [%X{userId:-}]"
  # Set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (or logstash, or gelf) to switch the console to structured
  # JSON, which is what a log collector wants. Left unset here because a human reading
  # `docker compose logs` wants the plain format.
  # structured:
  #   format:
  #     console: ecs
