spring:
  application:
    name: smartroute
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartroute}
    username: ${DB_USERNAME:smartroute}
    # No default: the password must come from the environment (.env locally, a secret store in production).
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    # The schema is owned by Flyway. Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Don't keep a DB session open during view rendering; it hides lazy-loading bugs and holds connections.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail fast: a slow or missing cache must not slow every route request down.
      timeout: 250ms
      connect-timeout: 250ms

smartroute:
  security:
    jwt:
      # No usable default: the app refuses to start without a secret of at least 32 bytes.
      secret: ${JWT_SECRET:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:true}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    bootstrap-admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
  routing:
    # Folder with nodes.csv/edges.csv (scripts/osm). Empty: generate the synthetic city.
    dataset-directory: ${ROAD_NETWORK_DIR:}
    max-snap-distance-meters: 300
    cache-ttl: 10m
  seed:
    # Password for the demo logins created by the "seed" profile; demo users are skipped when empty.
    demo-password: ${DEMO_USER_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  # Take the client IP and scheme from X-Forwarded-* headers, but only when the direct peer is on a
  # private network (the reverse proxy). Needed so the login rate limit sees real client IPs, not nginx's.
  forward-headers-strategy: native
  # Never leak stack traces or exception messages to API clients.
  error:
    include-stacktrace: never
    include-message: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Only health and info are public. Metrics are exposed in Phase 12, behind auth.
        include: health,info
  endpoint:
    health:
      # /actuator/health/liveness and /actuator/health/readiness for Docker/Kubernetes probes.
      probes:
        enabled: true
      group:
        # Redis is only a cache, so its outage must not take the app out of the load balancer.
        readiness:
          include: readinessState,db
      show-details: never
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

info:
  app:
    name: SmartRoute
    description: Intelligent real-time logistics and route optimization platform
    version: '@project.version@'

logging:
  pattern:
    # Every log line carries the request's correlation id (see CorrelationIdFilter).
    level: "%5p [%X{traceId:-}]"
