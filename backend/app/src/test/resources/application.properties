# Test-only values. Not secrets: they protect nothing outside the test JVM.
smartroute.security.jwt.secret=test-only-jwt-secret-0123456789abcdefghij
# BCrypt cost 4 keeps the suite fast; production uses 12.
smartroute.security.bcrypt-strength=4
smartroute.seed.demo-password=demo-password-for-tests
# Phase 9: no broker in the default test context. Events are still written to the outbox;
# only publishing to and consuming from Kafka is off. KafkaEventFlowTest turns it back on.
smartroute.events.enabled=false
# Phase 10: no scheduled tracking sweep in tests; each test runs the sweep itself. The reaction to a
# traffic change is not switched off by this, so FR-22 is still exercised.
smartroute.tracking.enabled=false
