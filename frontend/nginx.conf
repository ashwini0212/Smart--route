server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers for the static app. API responses get their own headers from Spring Security, which
    # does not help here: the HTML the browser actually executes is served by nginx, so the policy that
    # governs that document has to be set here too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 'unsafe-inline' for styles because Tailwind's runtime injects them; scripts need no such exception.
    # The tile host is listed because the live map loads OpenStreetMap tiles; nothing else is allowed.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    # Same-origin API access: the browser calls /api on this host, nginx forwards to the backend container.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # nginx is the edge, so it overwrites (never appends to) the client-supplied header: a client can't
        # pretend to be another IP to dodge the login rate limit. The backend trusts this header only from
        # private-network peers (Tomcat RemoteIpValve, server.forward-headers-strategy=native).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080;
    }

    # Client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached for a long time.
    # `expires` is used instead of add_header so the server-level security headers are still inherited.
    location /assets/ {
        expires 1y;
    }
}
